"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-stem-desktop-commands"
description = "Allows the trusted STEM web shell to call native desktop commands."
commands.allow = [
  "bootstrap",
  "resolve_deep_link",
  "take_pending_deep_link",
  "open_external_url",
  "set_unread_count",
  "set_desktop_music_player_state",
  "get_desktop_music_player_state",
  "set_desktop_music_mini_player_visible",
  "desktop_music_player_command",
  "get_autostart_enabled",
  "set_autostart_enabled",
  "get_microphone_access_enabled",
  "set_microphone_access_enabled",
  "get_desktop_activity_snapshot",
  "minimize_desktop_window",
  "toggle_desktop_window_maximized",
  "close_desktop_window_to_tray",
  "check_desktop_shell_update",
  "install_desktop_shell_update",
  "desktop_update_snapshot",
  "desktop_update_request_check",
  "desktop_update_set_safety",
  "desktop_update_apply",
  "desktop_runtime_ready",
  "desktop_runtime_heartbeat",
  "export_desktop_diagnostics",
  "ensure_desktop_notification_permission",
  "show_desktop_notification",
  "save_file_to_downloads_stem",
  "begin_file_save_to_downloads_stemred",
  "write_file_save_chunk_to_downloads_stemred",
  "finish_file_save_to_downloads_stemred",
  "cancel_file_save_to_downloads_stemred",
  "find_file_in_downloads_stemred",
  "begin_file_read_from_downloads_stemred",
  "read_file_chunk_from_downloads_stemred",
  "finish_file_read_from_downloads_stemred",
  "cancel_file_read_from_downloads_stemred",
  "desktop_path_exists",
  "open_downloaded_file",
  "get_desktop_music_runtime_capabilities",
  "pick_music_directory",
  "scan_music_directory",
  "cancel_music_directory_scan",
  "read_music_artwork",
  "open_music_range_source",
  "close_music_range_source",
  "revoke_music_directory",
  "read_music_file",
]
